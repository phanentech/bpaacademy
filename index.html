<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1b3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
:root{--navy:#0b1b3f;--navy2:#13265a;--purple:#7c3aed;--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e6e9f2;--bg:#f5f7fb;--r:18px;
--grad:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%);--grad-dark:linear-gradient(135deg,#0b1b3f 0%,#1e1b4b 55%,#3b0764 100%);--shadow:0 14px 34px -16px rgba(15,23,42,.25)}
*{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
a{cursor:pointer}
.btn{border-radius:12px;font-weight:600}
.btn-grad{background:var(--grad);color:#fff;border:0;padding:.62rem 1.25rem;box-shadow:0 10px 22px -10px rgba(124,58,237,.7);transition:transform .15s,box-shadow .15s}
.btn-grad:hover,.btn-grad:focus{color:#fff;transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(124,58,237,.8)}
.btn-soft{background:#eef2ff;color:#4338ca;border:0}.btn-soft:hover{background:#e0e7ff;color:#3730a3}
.btn-ghost-light{border:1px solid rgba(255,255,255,.35);color:#fff;padding:.62rem 1.25rem}.btn-ghost-light:hover{background:rgba(255,255,255,.1);color:#fff}
.text-grad{background:linear-gradient(90deg,#60a5fa,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:inline-flex;gap:.45rem;align-items:center;font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--purple);background:#f3e8ff;border-radius:99px;padding:.38rem .85rem}
.sec{padding:88px 0}.sec-alt{background:var(--bg)}
.sec-title{font-weight:800;letter-spacing:-.025em;font-size:clamp(1.7rem,3vw,2.5rem)}
.sec-sub{color:var(--muted);max-width:640px}
/* nav */
nav.pub{position:sticky;top:0;z-index:1030;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
nav.pub .nav-link{font-weight:600;color:#334155;font-size:.94rem;padding:.5rem .85rem!important;border-radius:10px}
nav.pub .nav-link:hover{color:var(--purple);background:#f5f3ff}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;color:var(--navy);text-decoration:none;letter-spacing:-.02em}
.brand-logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:1.05rem;flex-shrink:0;overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.dz-ed{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:600px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.dz-top{display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;border-bottom:1px solid var(--line);flex-wrap:wrap}.dz-title{max-width:260px;font-weight:700}
.dz-body{flex:1;display:flex;min-height:0}
.dz-rail{width:74px;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:.4rem .3rem;gap:.15rem;background:#f8fafc;overflow:auto}
.dz-rb{border:0;background:none;border-radius:10px;padding:.5rem .2rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;font-size:.66rem;font-weight:600;color:#475569}.dz-rb i{font-size:1.1rem}.dz-rb:hover{background:#eef2ff}.dz-rb.active{background:#e0e7ff;color:#3730a3}
.dz-panel{width:290px;border-right:1px solid var(--line);overflow:auto;padding:.85rem}
.dz-props{width:290px;border-left:1px solid var(--line);overflow:auto;padding:.85rem}
.dz-ph{font-weight:800;font-size:.85rem;margin-bottom:.5rem;color:var(--navy)}
.dz-work{flex:1;min-width:0;overflow:auto;background:#e9edf3;display:flex;flex-direction:column;align-items:center;padding:24px;position:relative}.dz-work.dz-drop{outline:3px dashed #6366f1;outline-offset:-10px}
.dz-wrap{position:relative;flex:none;margin:auto;box-shadow:0 10px 40px -12px rgba(15,23,42,.35)}
.dz-stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff}.dz-stage .dz-el{cursor:move}.dz-stage [contenteditable=true]{cursor:text;caret-color:#6366f1}
.dz-over{position:absolute;inset:0;pointer-events:none}
.dz-box{position:absolute;border:2px solid #6366f1;box-sizing:border-box;transform-origin:center center}.dz-box.lock{border-style:dashed;border-color:#f59e0b}
.dz-h{position:absolute;width:14px;height:14px;background:#fff;border:2px solid #6366f1;border-radius:50%;pointer-events:auto;touch-action:none}
.dz-h-nw{left:-8px;top:-8px;cursor:nwse-resize}.dz-h-ne{right:-8px;top:-8px;cursor:nesw-resize}.dz-h-se{right:-8px;bottom:-8px;cursor:nwse-resize}.dz-h-sw{left:-8px;bottom:-8px;cursor:nesw-resize}
.dz-h-n,.dz-h-s{left:50%;margin-left:-11px;width:22px;height:9px;border-radius:5px}.dz-h-n{top:-5px;cursor:ns-resize}.dz-h-s{bottom:-5px;cursor:ns-resize}
.dz-h-e,.dz-h-w{top:50%;margin-top:-11px;width:9px;height:22px;border-radius:5px}.dz-h-e{right:-5px;cursor:ew-resize}.dz-h-w{left:-5px;cursor:ew-resize}
.dz-rot{left:50%;bottom:-40px;margin-left:-13px;width:26px;height:26px;display:grid;place-items:center;font-size:.7rem;color:#6366f1;cursor:grab}
.dz-lk{position:absolute;right:-10px;top:-10px;background:#f59e0b;color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:.6rem}
.dz-guide{position:absolute;background:#ec4899}.dz-guide.v{top:0;bottom:0;width:1px}.dz-guide.h{left:0;right:0;height:1px}
.dz-dim{position:absolute;background:#0b1b3f;color:#fff;font-size:.7rem;padding:.15rem .4rem;border-radius:6px;white-space:nowrap}
.dz-hint{margin-top:10px;flex:none}
.dz-grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.dz-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}.dz-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}.dz-grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem}
.dz-tpl{border:0;background:none;padding:0;text-align:left;font-size:.72rem;font-weight:700;color:var(--navy);display:flex;flex-direction:column;gap:.15rem}.dz-tpl small{font-weight:500;color:#64748b;font-size:.66rem}.dz-tpl:hover .dz-fit{box-shadow:0 0 0 2px #6366f1!important}
.dz-it{border:1px solid var(--line);background:#fff;border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#334155;padding:.3rem;gap:.15rem;font-size:1rem;overflow:hidden}.dz-it:hover{border-color:#6366f1;background:#f5f3ff}.dz-it.on{border-color:#6366f1;box-shadow:0 0 0 2px #c7d2fe}.dz-it small{font-size:.6rem;font-weight:600;line-height:1.1}.dz-it.tall{aspect-ratio:auto;min-height:74px}.dz-it svg{max-width:100%;max-height:56px}
.dz-fr{width:30px;height:30px;display:block;background:repeating-linear-gradient(45deg,#cbd5e1,#cbd5e1 4px,#e2e8f0 4px,#e2e8f0 8px)}
.dz-txb{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.6rem .7rem;margin-bottom:.4rem;text-align:left;color:var(--navy)}.dz-txb:hover{border-color:#6366f1;background:#f5f3ff}
.dz-assets{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}.dz-as{position:relative;border-radius:10px;overflow:hidden;background:#f1f5f9;aspect-ratio:1;cursor:pointer;border:1px solid var(--line)}.dz-as img{width:100%;height:100%;object-fit:cover}.dz-as:hover{box-shadow:0 0 0 2px #6366f1}
.dz-asx{position:absolute;right:4px;top:4px;border:0;background:rgba(15,23,42,.7);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.65rem;display:none}.dz-as:hover .dz-asx{display:block}.dz-asl{position:absolute;left:4px;bottom:4px;background:#fff;border-radius:6px;font-size:.6rem;font-weight:700;padding:0 .3rem}
.dz-sw{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}.dz-sw button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line)}.dz-sw button.on{box-shadow:0 0 0 2px #6366f1}
.dz-sws{width:20px;height:20px;border-radius:6px;border:1px solid #cbd5e1;padding:0}.dz-sws.on{box-shadow:0 0 0 2px #6366f1}.dz-sws.none{background:linear-gradient(135deg,#fff 45%,#ef4444 45%,#ef4444 55%,#fff 55%)!important}
.dz-color{width:34px;height:28px;border:1px solid var(--line);border-radius:7px;padding:1px;background:#fff}
.dz-row{margin-bottom:.55rem}.dz-row>label{display:block;font-size:.7rem;font-weight:700;color:#64748b;margin-bottom:.2rem}.dz-row .form-range{flex:1}.dz-n{width:68px}
.dz-tg{font-size:.8rem;margin-bottom:.4rem}
.dz-acts{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:.6rem}
.dz-sec{border-top:1px solid var(--line);padding:.5rem 0}.dz-sec summary{font-weight:700;font-size:.8rem;cursor:pointer;color:var(--navy);list-style:none;display:flex;justify-content:space-between}.dz-sec summary::after{content:'\25BE';color:#94a3b8}.dz-secb{padding-top:.5rem}
.dz-xywh{display:grid;grid-template-columns:repeat(5,1fr);gap:.25rem;margin-bottom:.5rem}.dz-xywh label{font-size:.65rem;font-weight:700;color:#64748b}.dz-xywh input{padding:.2rem .3rem;font-size:.75rem}
.dz-layers{display:flex;flex-direction:column;gap:.2rem}.dz-ly{display:flex;align-items:center;gap:.4rem;border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;font-size:.75rem;cursor:pointer}.dz-ly span{flex:1;min-width:0}.dz-ly.on{border-color:#6366f1;background:#eef2ff}
.dz-tips{border-top:1px solid var(--line);padding-top:.6rem;margin-top:.4rem;font-size:.72rem;line-height:1.6}
@media (max-width:991.98px){.dz-ed{height:auto;min-height:0}.dz-body{flex-direction:column}.dz-work{order:1}.dz-rail{order:2}.dz-panel{order:3}.dz-props{order:4}.dz-rail{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}.dz-rb{min-width:66px}.dz-panel,.dz-props{width:auto;border:0;max-height:none}.dz-panel{max-height:300px;border-bottom:1px solid var(--line)}.dz-work{min-height:62vh;padding:14px}.dz-props{border-top:1px solid var(--line)}.dz-hint{display:none}.dz-title{max-width:150px}}
.tab-prev{display:flex;align-items:center;gap:.5rem;background:#eef1f6;border-radius:10px 10px 0 0;padding:.5rem .75rem;max-width:280px;font-size:.85rem}.tab-prev img{width:16px;height:16px;object-fit:contain;border-radius:3px}.tab-prev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-prev{border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem}.g-prev .g-t{color:#1a0dab;font-size:1.05rem;line-height:1.3}
/* hero */
.hero{background:var(--grad-dark);color:#fff;position:relative;overflow:hidden;padding:84px 0 120px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.hero:before{width:520px;height:520px;background:#2563eb;top:-180px;right:-120px}
.hero:after{width:420px;height:420px;background:#a21caf;bottom:-220px;left:-120px;opacity:.35}
.hero .container{position:relative;z-index:2}
.hero h1{font-weight:800;font-size:clamp(2.2rem,4.8vw,3.7rem);line-height:1.06;letter-spacing:-.03em}
.hero p.lead{color:#c7d2fe;font-size:1.12rem;max-width:560px}
.hero-chip{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:.4rem .9rem;border-radius:99px;font-size:.85rem;color:#e0e7ff}
.hero-stats .n{font-size:1.6rem;font-weight:800}.hero-stats .l{font-size:.8rem;color:#a5b4fc}
.mock-wrap{position:relative;padding:20px}
.mock{background:#fff;border-radius:20px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);color:var(--ink);overflow:hidden;transform:perspective(1400px) rotateY(-8deg) rotateX(4deg);animation:floaty 7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:perspective(1400px) rotateY(-8deg) rotateX(4deg) translateY(0)}50%{transform:perspective(1400px) rotateY(-8deg) rotateX(4deg) translateY(-10px)}}
.mock-top{background:#f1f5f9;padding:10px 14px;display:flex;gap:6px;align-items:center}
.mock-top span{width:10px;height:10px;border-radius:50%;background:#cbd5e1}.mock-top span:nth-child(1){background:#f87171}.mock-top span:nth-child(2){background:#fbbf24}.mock-top span:nth-child(3){background:#34d399}
.mock-url{margin-left:10px;font-size:.72rem;color:#94a3b8;background:#fff;border-radius:8px;padding:2px 10px}
.mock-body{padding:18px}
.mk-sm{font-size:.72rem;color:#94a3b8}.mk-h{font-weight:800;font-size:1.05rem}
.mk-pill{font-size:.7rem;background:#ecfdf5;color:#047857;border-radius:99px;padding:4px 10px;font-weight:600}
.mk-tile{background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:10px}
.mk-tile .t{font-size:.72rem;font-weight:700}.mk-bar{height:6px;background:#e2e8f0;border-radius:9px;margin-top:6px;overflow:hidden}.mk-bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.mk-chart{display:flex;align-items:flex-end;gap:7px;height:110px;padding:10px;background:linear-gradient(180deg,#f8fafc,#fff);border-radius:12px;border:1px solid #eef2f7}
.mk-chart i{flex:1;background:var(--grad);border-radius:6px 6px 2px 2px;opacity:.85}
.float-card{position:absolute;background:#fff;color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.8rem;font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;z-index:3}
.float-card i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff}
.fc1{left:-6px;bottom:30px;animation:floaty2 6s ease-in-out infinite}.fc1 i{background:#f59e0b}
.fc2{right:-4px;top:40px;animation:floaty2 6s ease-in-out 1.5s infinite}.fc2 i{background:#7c3aed}
@keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* cards */
.cat-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.4rem;height:100%;transition:.25s;position:relative;overflow:hidden}
.cat-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:#c7d2fe}
.cat-ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:1.3rem;color:#fff;background:var(--grad);margin-bottom:1rem}
.cat-card h6{font-weight:700}
.cat-card p{color:var(--muted);font-size:.88rem}
.p-card{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#fff;transition:.25s;height:100%;display:flex;flex-direction:column}
.p-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.p-cover{height:176px;background:var(--grad);background-size:cover;background-position:center;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:3rem}
.p-cover .tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);color:var(--navy);font-size:.72rem;font-weight:700;border-radius:99px;padding:.3rem .7rem}
.p-cover .tag2{left:auto;right:12px;background:rgba(11,27,63,.85);color:#fff}
.p-body{padding:1.15rem 1.2rem;display:flex;flex-direction:column;flex:1}
.p-body h5{font-weight:700;font-size:1.06rem;line-height:1.35}
.p-meta{display:flex;flex-wrap:wrap;gap:.35rem 1rem;font-size:.8rem;color:var(--muted);margin:.5rem 0 .9rem}
.p-meta i{color:var(--purple);margin-right:.25rem}
.p-price{font-weight:800;font-size:1.2rem;color:var(--navy)}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.42rem 1rem;font-size:.86rem;font-weight:600;color:#334155;cursor:pointer;transition:.15s}
.chip.active,.chip:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.why-card{display:flex;gap:1rem;padding:1.3rem;border-radius:var(--r);background:#fff;border:1px solid var(--line);height:100%}
.why-card .ic{width:46px;height:46px;flex-shrink:0;border-radius:13px;display:grid;place-items:center;background:#eef2ff;color:var(--blue);font-size:1.1rem}
.step{text-align:center;padding:1.5rem 1rem;position:relative}
.step .num{width:64px;height:64px;border-radius:20px;background:var(--grad);color:#fff;font-weight:800;font-size:1.4rem;display:grid;place-items:center;margin:0 auto 1rem;box-shadow:0 14px 28px -12px rgba(124,58,237,.7)}
.cls-card{display:flex;gap:1rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:1rem;height:100%}
.date-blk{width:62px;flex-shrink:0;text-align:center;border-radius:14px;background:var(--grad);color:#fff;padding:.5rem 0}
.date-blk .d{font-size:1.4rem;font-weight:800;line-height:1}.date-blk .m{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.t-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.5rem;height:100%}
.t-card .q{font-size:2rem;color:#c4b5fd;line-height:1}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0;overflow:hidden;font-size:.9rem}
.avatar img{width:100%;height:100%;object-fit:cover}
.accordion-button{font-weight:600}.accordion-button:not(.collapsed){background:#f5f3ff;color:var(--purple);box-shadow:none}
.accordion-item{border-radius:14px!important;overflow:hidden;border:1px solid var(--line)!important;margin-bottom:.6rem}
.cta{background:var(--grad-dark);border-radius:28px;color:#fff;padding:3.2rem 2rem;position:relative;overflow:hidden}
footer.pub{background:var(--navy);color:#94a3b8;padding:64px 0 28px}
footer.pub h6{color:#fff;font-weight:700}
footer.pub a{color:#cbd5e1;text-decoration:none}footer.pub a:hover{color:#fff}
.soc{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.08);display:inline-grid;place-items:center;color:#fff;margin-right:.35rem}
.soc:hover{background:var(--purple)}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}.reveal.in{opacity:1;transform:none}
.maint{background:#fef3c7;color:#92400e;text-align:center;padding:.5rem;font-size:.88rem;font-weight:600}
/* app shell */
.app{min-height:100vh;background:var(--bg)}
.sidebar{width:268px;background:var(--navy);color:#cbd5e1;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:1045;transition:transform .25s ease;display:flex;flex-direction:column}
.sidebar .sb-brand{padding:1.2rem 1.2rem 1rem;display:flex;align-items:center;gap:.6rem;color:#fff;font-weight:800}
.sidebar .sb-label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#64748b;padding:.9rem 1.5rem .35rem;font-weight:700}
.nav-i{display:flex;gap:.8rem;align-items:center;padding:.6rem .95rem;margin:.08rem .75rem;border-radius:12px;color:#cbd5e1;text-decoration:none;font-weight:500;font-size:.9rem;transition:.15s}
.nav-i i{width:18px;text-align:center;opacity:.85}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i.active{background:var(--grad);color:#fff;box-shadow:0 10px 20px -10px rgba(124,58,237,.8)}
.sb-foot{margin-top:auto;padding:1rem}
.main{margin-left:268px;min-width:0}
.topbar{position:sticky;top:0;background:rgba(245,247,251,.88);backdrop-filter:blur(12px);z-index:1030;padding:.85rem 1.5rem;display:flex;align-items:center;gap:.9rem;border-bottom:1px solid var(--line)}
.topbar h4{font-weight:800;margin:0;font-size:1.15rem;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:#334155;position:relative}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:#ef4444;color:#fff;font-size:.65rem;display:grid;place-items:center;font-weight:700;padding:0 4px}

function heroTitle(t) {
  const parts = String(t || '').split('.').map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return esc(t);
  return parts.slice(0, -1).map(p => esc(p) + '.').join(' ') + ' <span class="text-grad">' + esc(parts[parts.length - 1]) + '.</span>';
}
function bindReveal() {
  const els = $$('.reveal');
  if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(en => en.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .08 });
  els.forEach(e => io.observe(e));
}
function drawCatChips() {

}

function drawProgGrid() {

  el.innerHTML = list.length ? list.map(p => progCard(p)).join('') : `<div class="col-12">${empty('fa-book-open', 'No programmes found', S.pub.programmes.length ? 'Try a different search or category.' : 'New programmes are coming soon. Check back shortly!')}</div>`;

async function doAuth(ev, mode) {
  ev.preventDefault();
  const f = ev.target, btn = $('button[type=submit]', f);
  const d = Object.fromEntries(new FormData(f).entries());
  $('#authErr').innerHTML = '';
  if ((mode === 'register' || mode === 'reset') && d.password !== d.password2) { $('#authErr').innerHTML = '<div class="alert alert-danger py-2 small">Passwords do not match.</div>'; return false; }
  btn.disabled = true; const h = btn.innerHTML; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Please wait…';
  try {
    if (mode === 'login' || mode === 'register') {
      const r = await call(mode, d);
      S.token = r.token; store.set('bpa_lms_token', r.token); S.user = r.user; saveUser(); rcLoad();
      closeModal();
      toast(mode === 'register' ? 'Welcome aboard! Check your email to verify your account.' : 'Welcome back, ' + (r.user.name || '').split(' ')[0] + '!');
      if (S.view === 'hub' && S.hub) return renderHubPage();
      if (S.view === 'join' && S.join) return renderJoinPage(S.join.p, S.join.k);
      if (S.pendingEnrol && r.user.role === 'STUDENT') { const id = S.pendingEnrol; S.pendingEnrol = null; renderPublic(); return setTimeout(() => openProgramme(id), 400); }
      if (S.afterLogin) { const a = S.afterLogin; S.afterLogin = null; const pages = r.user.role === 'STUDENT' ? STUDENT_PAGES : ADMIN_PAGES; if (pages[a.sec]) return goApp(a.sec, a.arg || undefined); }
      goApp();
    } else if (mode === 'forgot') {
      const r = await call('forgotPassword', d);
      $('#mBody').innerHTML = `<div class="text-center p-3"><div class="big-ic ic-green"><i class="fa-solid fa-envelope-circle-check"></i></div><h5 class="fw-bold">Check your inbox</h5><p class="text-muted">${esc(r.message)}</p><button class="btn btn-grad" onclick="openAuth('login')">Back to login</button></div>`;
    } else if (mode === 'reset') {
      await call('resetPassword', d);
      $('#mBody').innerHTML = `<div class="text-center p-3"><div class="big-ic ic-green"><i class="fa-solid fa-key"></i></div><h5 class="fw-bold">Password updated</h5><p class="text-muted">You can now log in with your new password.</p><button class="btn btn-grad" onclick="openAuth('login')">Log in</button></div>`;
    }
  } catch (e) { $('#authErr').innerHTML = `<div class="alert alert-danger py-2 small">${esc(e.message)}</div>`; }
  finally { if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = h; } }
  return false;
}

function fmtAi(t) {
  return String(t || '').split('```').map((seg, i) => {
    if (i % 2) return `<pre class="chat-code">${esc(seg.replace(/^[a-zA-Z0-9_+-]*\n/, ''))}</pre>`;
    let h = esc(seg).replace(/^#{1,6}\s*(.+)$/gm, '**$1**');
    h = h.split('**').map((x, j) => j % 2 ? '<b>' + x + '</b>' : x).join('');
    h = h.split('`').map((x, j) => j % 2 ? '<code>' + x + '</code>' : x).join('');
    return h;
  }).join('');
}
function drawChat(pending) {
  const box = $('#chatBody'); if (!box) return;
  const m = S.tutor.messages;
  const first = (S.user.name || '').split(' ')[0];
  if (!m.length && !pending) {
    const ideas = ['Explain the last lesson in simple terms', 'Give me 5 practice questions with answers', 'What are the most important topics to revise?', 'Show me a real-world example I can practise'];
    box.innerHTML = `<div class="text-center py-4"><div class="big-ic ic-purple"><i class="fa-solid fa-wand-magic-sparkles"></i></div><h5 class="fw-bold">Hi ${esc(first)}, how can I help you learn today?</h5><p class="text-muted small mb-0">Ask about your lessons, get step-by-step explanations, examples and practice questions.</p>
      <div class="suggest">${ideas.map(q => `<span class="chip" onclick="askTutor('${esc(q)}')">${esc(q)}</span>`).join('')}</div></div>`;
    return;
  }
  box.innerHTML = m.map(x => x.role === 'user'
    ? `<div class="msg me"><div class="avatar" style="width:34px;height:34px;font-size:.75rem">${esc(initials(S.user.name))}</div><div class="bubble">${esc(x.content)}</div></div>`
    : `<div class="msg ${x.error ? 'err' : 'ai'}"><div class="ai-av"><i class="fa-solid ${x.error ? 'fa-triangle-exclamation' : 'fa-robot'}"></i></div><div class="bubble">${x.error ? esc(x.content) : fmtAi(x.content)}${x.model ? `<div class="small-muted mt-2" style="font-size:.7rem">${esc(x.model)}</div>` : ''}</div></div>`).join('') +
    (pending ? '<div class="msg ai"><div class="ai-av"><i class="fa-solid fa-robot"></i></div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div></div>' : '');
  box.scrollTop = box.scrollHeight;
}
function askTutor(q) { const i = $('#chatIn'); if (i) { i.value = q; sendTutor(); } }
async function sendTutor(ev) {
  if (ev) ev.preventDefault();
  const input = $('#chatIn'), btn = $('#chatSend');
  const text = (input.value || '').trim();
  if (!text || S.tutor.busy) return;
  S.tutor.busy = true; btn.disabled = true; input.value = ''; input.style.height = '';
  S.tutor.messages = S.tutor.messages.filter(x => !x.error);
  S.tutor.messages.push({ role: 'user', content: text });
  drawChat(true);
  try {
    const r = await call('aiTutor', { programmeId: S.tutor.programmeId, messages: S.tutor.messages.map(x => ({ role: x.role, content: x.content })).slice(-12) });
    S.tutor.messages.push({ role: 'assistant', content: r.reply, model: r.model });
  } catch (e) {
    S.tutor.messages.push({ role: 'assistant', content: e.message, error: true });
  } finally {
    S.tutor.busy = false;
    if (document.body.contains(btn)) { btn.disabled = false; drawChat(); $('#chatIn').focus(); }
  }
}

function fitBox(html, w, h, extra) { return `<div class="dz-fit" data-w="${w}" data-h="${h}" style="${extra || ''}"><div class="dz-inner" style="width:${w}px;height:${h}px">${html}</div></div>`; }
function fitText(root) {
  $$('[data-fit]', root || document).forEach(el => {
    if (!el.dataset.fs) el.dataset.fs = parseFloat(el.style.fontSize) || 40;
    let fs = Number(el.dataset.fs), g = 0;
    el.style.fontSize = fs + 'px';
    while (el.scrollWidth > el.clientWidth + 1 && fs > 10 && g++ < 40) { fs *= 0.93; el.style.fontSize = fs + 'px'; }
  });
}
function fitDesigns(root) {
  fitText(root);
  $$('.dz-fit', root || document).forEach(el => {
    const w = Number(el.dataset.w), h = Number(el.dataset.h), cw = el.clientWidth;
    if (!cw) return;
    const sc = cw / w;
    el.style.height = Math.round(h * sc) + 'px';
    el.firstElementChild.style.transform = 'scale(' + sc + ')';
  });
}
window.addEventListener('resize', () => fitDesigns());
try { if (document.fonts) document.fonts.addEventListener('loadingdone', () => fitDesigns()); } catch (e) {}
async function loadLogoData() {

  S.logoData = '';
  if (url && S.user && S.user.role !== 'STUDENT') { try { S.logoData = (await call('imageData', { url })).data || ''; } catch (e) {} }
  return S.logoData;
}
async function renderToCanvas(html, W, H, scale) {
  await loadLib('h2c');
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:0;top:0;width:' + W + 'px;height:' + H + 'px;z-index:-9999;pointer-events:none;overflow:hidden';
  host.innerHTML = html;
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    fitText(host);
    await Promise.all($$('img', host).map(img => img.complete ? null : new Promise(r => { img.onload = r; img.onerror = r; })));
    return await html2canvas(host.firstElementChild, { scale: scale || 1, useCORS: true, backgroundColor: '#ffffff', logging: false, width: W, height: H, windowWidth: Math.max(W, window.innerWidth), windowHeight: Math.max(H, window.innerHeight), scrollX: 0, scrollY: 0 });
  } finally { host.remove(); }
}
async function exportDesign(html, W, H, filename, fmt, a4landscape) {
  showLoader(fmt === 'pdf' ? 'Creating PDF…' : 'Creating image…');
  try {
    if (fmt === 'pdf') await loadLib('pdf');
    const canvas = await renderToCanvas(html, W, H, a4landscape ? 2 : (W <= 1300 ? 2 : 1));
    const safe = String(filename || 'design').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'design';
    if (fmt === 'pdf') {
      const PDF = window.jspdf.jsPDF;
      const img = canvas.toDataURL('image/jpeg', 0.95);
      const doc = a4landscape ? new PDF({ orientation: 'landscape', unit: 'mm', format: 'a4' }) : new PDF({ orientation: W > H ? 'landscape' : 'portrait', unit: 'px', format: [W, H], hotfixes: ['px_scaling'] });
      if (a4landscape) doc.addImage(img, 'JPEG', 0, 0, 297, 210); else doc.addImage(img, 'JPEG', 0, 0, W, H);
      downloadBlob(doc.output('blob'), safe + '.pdf');
    } else if (fmt === 'jpg') {
      const c2 = document.createElement('canvas'); c2.width = canvas.width; c2.height = canvas.height; const g = c2.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c2.width, c2.height); g.drawImage(canvas, 0, 0);
      const blob = await new Promise(r => c2.toBlob(r, 'image/jpeg', .9));
      downloadBlob(blob, safe + '.jpg');
    } else {
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      downloadBlob(blob, safe + '.png');
    }
    toast('Download ready.');
  } catch (e) { toast(e.message || 'Export failed.', 'danger'); }
  finally { hideLoader(); }
}

function dzResize(key, w, h) {
  const D = S.dz;
  let W = Number(w), H = Number(h);
  if (key !== 'custom') { W = DZ_SIZES[key][0]; H = DZ_SIZES[key][1]; }
  W = Math.max(200, Math.min(4000, Math.round(W || D.d.w))); H = Math.max(200, Math.min(4000, Math.round(H || D.d.h)));
  if (W === D.d.w && H === D.d.h) return;
  const f = Math.min(W / D.d.w, H / D.d.h), ox = (W - D.d.w * f) / 2, oy = (H - D.d.h * f) / 2;
  D.d.els.forEach(e => { e.x = Math.round(e.x * f + ox); e.y = Math.round(e.y * f + oy); e.w = Math.round(e.w * f); e.h = Math.round(e.h * f); if (e.size) e.size = Math.max(6, Math.round(e.size * f)); if (e.sw) e.sw = Math.max(1, Math.round(e.sw * f)); if (e.radius) e.radius = Math.round(e.radius * f); if (e.pad) e.pad = Math.round(e.pad * f); });
  D.d.w = W; D.d.h = H; D.sel = [];

function normCode(c) { return String(c || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 30); }

function cdText(iso, short) {
  const ms = new Date(iso) - Date.now();
  if (!(ms > 0)) return 'Ended';
  const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
  const p2 = n => String(n).padStart(2, '0');
  if (short) return d > 0 ? d + 'd ' + p2(h) + 'h left' : (h > 0 ? h + 'h ' + p2(m) + 'm left' : m + 'm ' + p2(s) + 's left');
  return (d > 0 ? d + 'd ' : '') + p2(h) + ':' + p2(m) + ':' + p2(s);
}
let _cdTick = 0;

function activePromos() { const now = Date.now(); return ((S.pub && S.pub.promos) || []).filter(c => !c.expiresAt || new Date(c.expiresAt) > now); }
function promoCalc(c, price) {
  price = Number(price || 0);
  if (!(price > 0) || (c.minAmount && price < c.minAmount)) return null;
  const v = Number(c.value || 0);
  const off = c.type === 'free' ? price : c.type === 'fixed' ? Math.min(v, price) : Math.round(price * Math.min(100, v) / 100);
  return off > 0 ? { off: off, final: price - off } : null;
}
function promoFor(p) {
  if (!p || !(p.price > 0)) return null;
  const saved = store.get('bpa_coupon');
  let best = null;
  activePromos().forEach(c => {
    if (c.programmeIds && c.programmeIds.length && c.programmeIds.indexOf(p.id) < 0) return;
    const q = promoCalc(c, p.price); if (!q) return;
    const score = q.off + (saved === c.code ? 1e12 : 0);

  return best;
}

async function bulkIssue(btn) {

      tot.issued += r.issued; tot.skipped += r.skipped; tot.failed = tot.failed.concat(r.failed);
    }
    const name = id => (B.rows.find(x => x.studentId === id) || {}).name || id;
    modal('Certificates issued 🎉', `<div class="text-center p-2"><div class="big-ic ic-green"><i class="fa-solid fa-award"></i></div><h4 class="fw-bold">${tot.issued} certificate${tot.issued === 1 ? '' : 's'} issued</h4><p class="text-muted mb-2">${esc(B.programme.title)}${B.email ? ' · students have been emailed' : ''}</p>${tot.skipped ? `<div class="small-muted">${tot.skipped} already had a certificate and were skipped.</div>` : ''}</div>${tot.failed.length ? `<div class="alert alert-warning small mt-3"><b>${tot.failed.length} could not be issued:</b><ul class="mb-0 mt-1">${tot.failed.map(f => `<li>${esc(name(f.studentId))}: ${esc(f.error)}</li>`).join('')}</ul></div>` : ''}`, `<button class="btn btn-grad w-100" onclick="closeModal();nav('certificates')">Done</button>`);
  } catch (e) {
    toast((tot.issued ? tot.issued + ' issued before an error: ' : '') + e.message, 'danger');
    btn.disabled = false; bulkCount();
  }
}

      : q.type === 'tf' ? `<div class="d-flex gap-2">${[[true, 'True'], [false, 'False']].map(o => `<button type="button" class="btn btn-sm ${q.answer === o[0] ? 'btn-grad' : 'btn-light'}" onclick="qqSet(${i},'answer',${o[0]});qqRedraw()">${o[1]}${q.answer === o[0] ? ' <i class="fa-solid fa-check ms-1"></i>' : ''}</button>`).join('')}<span class="small-muted align-self-center">← correct answer</span></div>`
      : `<input class="form-control form-control-sm" value="${esc(q.answer)}" placeholder="Accepted answer(s), separate alternatives with |  e.g. CALCULATE|calculate()" oninput="qqSet(${i},'answer',this.value)" aria-label="Accepted answers"><div class="form-text">Marking ignores capital letters and extra spaces.</div>`}

async function qzAi(btn) {
  const topic = $('#qzAiTopic').value.trim(), n = Math.max(1, Math.min(20, Number($('#qzAiN').value) || 5));
  if (!topic) return toast('Enter the topic first.', 'warning');
  await busy(btn, async () => {
    const r = await call('aiGenerate', { entity: 'Quizzes', field: 'Questions', modelId: $('#qzAiModel').value, instructions: 'Write ' + n + ' questions.', context: { Topic: topic, Programme: progTitle(S.qz.ProgrammeID), 'Quiz title': S.qz.Title } });
    const out = [];
    String(r.text).split(/\n\s*\n/).forEach(block => {
      const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
      const q = { type: 'single', q: '', options: [], answer: 0, points: 1, explain: '' };
      lines.forEach(l => { let m;
        if ((m = l.match(/^Q\d*[:.)]\s*(.+)/i))) q.q = m[1];
        else if ((m = l.match(/^([A-H])[).:]\s*(.+)/))) q.options.push(m[2]);
        else if ((m = l.match(/^ANSWER[:\s]+([A-H])/i))) q.answer = m[1].toUpperCase().charCodeAt(0) - 65;
        else if ((m = l.match(/^WHY[:\s]+(.+)/i))) q.explain = m[1]; });
      if (q.q && q.options.length >= 2 && q.answer < q.options.length) out.push(q);
    });
    if (!out.length) throw new Error('The AI reply could not be turned into questions. Try again or pick another model.');
    S.qz.Questions = S.qz.Questions.filter(x => String(x.q).trim()).concat(out);
    toast(out.length + ' questions drafted by ' + r.model + '. Please review them.'); qqRedraw();
  });
}

  S.em.Name = S.fr.form.Title + ' · ' + S.frSel.size + ' selected';
}
function frExport() {
  const f = S.fr.form, qs = f.fields.filter(q => q.type !== 'section');
  const rows = S.fr.responses.map(x => { const o = { id: x.id, date: x.date, status: x.status, award: x.award || '', notes: x.notes || '' }; qs.forEach(q => { const v = x.answers[q.id]; o[q.id] = v == null ? '' : q.type === 'file' ? (v.name || '') : Array.isArray(v) ? v.join('; ') : v; }); return o; });
  exportCSV(f.Title.replace(/[^\w]+/g, '-') + '-responses', rows, [['id', 'Reference'], ['date', 'Received']].concat(qs.map(q => [q.id, q.label])).concat([['status', 'Status'], ['award', 'Scholarship code'], ['notes', 'Notes']]));
}

const FR_MSG = {
  Shortlisted: { subject: 'Good news: you\'ve been shortlisted 🎉', body: 'Great news! Your application for {{form}} has been shortlisted.\n\nOur team will contact you shortly with the next steps. Please keep an eye on your email and WhatsApp, and reply promptly when we reach out.' },
  Approved: { subject: '🎉 Congratulations! You\'ve been accepted', body: 'Congratulations! We are delighted to let you know that your application for {{form}} has been approved.\n\nFollow the steps below to create your student account and secure your place. Please do this as soon as possible: places are limited.' },
  Rejected: { subject: 'Your application: {{form}}', body: 'Thank you for applying for {{form}}. We received many strong applications and, unfortunately, we are not able to offer you a place this time.\n\nPlease don\'t be discouraged: we run new programmes and scholarships regularly and would love to see you apply again.' }
};
function frDecide(st, ids) {
  ids = ids || Array.from(S.frSel);
  if (!ids.length) return toast('Select at least one applicant.', 'warning');
  S.frDec = { st, ids };
  const n = ids.length, f = S.fr.form, M = FR_MSG[st], ap = st === 'Approved', rej = st === 'Rejected';
  const title = ap ? 'Approve & send sign-up link' : st === 'Shortlisted' ? 'Shortlist applicants' : 'Reject applicants';
  modal(`<i class="fa-solid ${ap ? 'fa-circle-check text-success' : st === 'Shortlisted' ? 'fa-star text-primary' : 'fa-circle-xmark text-danger'} me-2"></i>${title}`, `<p class="mb-3"><b>${n}</b> applicant${n === 1 ? '' : 's'} will be marked <b>${st.toLowerCase()}</b>.</p>
    ${ap ? `<div class="card-x bg-light mb-3"><div class="row g-2"><div class="col-12"><label class="form-label small" for="dcProg">Programme they'll sign up for</label><select class="form-select" id="dcProg">${optProg().map(o => `<option value="${esc(o[0])}" ${o[0] === f.ProgrammeID ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>
      <div class="col-sm-6"><label class="form-label small" for="dcType">Scholarship</label><select class="form-select" id="dcType" onchange="$('#dcValW').style.display=this.value==='percent'?'':'none';$('#dcDaysW').style.display=this.value==='none'?'none':''"><option value="free">Full tuition: 100% code</option><option value="percent">Partial: % off code</option><option value="none">No code: just the sign-up link</option></select></div>
      <div class="col-sm-3" id="dcValW" style="display:none"><label class="form-label small" for="dcVal">% off</label><input class="form-control" type="number" min="1" max="99" id="dcVal" value="50"></div>
      <div class="col-sm-3" id="dcDaysW"><label class="form-label small" for="dcDays">Valid (days)</label><input class="form-control" type="number" min="1" max="365" id="dcDays" value="14"></div></div>
      <div class="small-muted mt-2"><i class="fa-solid fa-circle-info me-1"></i>Each person gets their own one-time code plus a <b>Sign up & register</b> button. The code applies automatically when they enrol. Private programmes use the invite link.</div></div>` : ''}
    <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="dcMail" ${rej ? '' : 'checked'} onchange="$('#dcMailBox').style.display=this.checked?'':'none'"><label class="form-check-label fw-semibold" for="dcMail">Email ${n === 1 ? 'the applicant' : 'each applicant'}</label></div>
    <div id="dcMailBox" style="${rej ? 'display:none' : ''}"><label class="form-label small mb-1" for="dcSubj">Subject</label><input class="form-control mb-2" id="dcSubj" value="${esc(M.subject)}">
      <label class="form-label small mb-1" for="dcMsg">Message</label><textarea class="form-control" id="dcMsg" rows="6">${esc(M.body)}</textarea>
      <div class="form-text">Starts with "Hi {first name}," and ends with your academy's name. You can use {{first_name}}, {{form}} and {{programme}}.${ap ? ' The code, sign-up steps and button are added below your message automatically.' : ''}</div></div>`,
    `<button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn ${rej ? 'btn-danger' : 'btn-grad'}" onclick="frDoDecide(this)">${ap ? '<i class="fa-solid fa-paper-plane me-1"></i>Approve & email' : st === 'Shortlisted' ? '<i class="fa-solid fa-star me-1"></i>Shortlist' : 'Reject'}${n > 1 ? ' ' + n : ''}</button>`, 'lg');
}
async function frDoDecide(btn) {
  const D = S.frDec, ap = D.st === 'Approved', notify = $('#dcMail').checked;
  if (ap && !$('#dcProg').value) return toast('Choose the programme they will sign up for.', 'warning');
  await busy(btn, async () => {
    const r = await call('formResponseUpdate', { formId: S.fr.form.FormID, ids: D.ids, status: D.st, notify, subject: $('#dcSubj').value, message: $('#dcMsg').value, award: ap ? { programmeId: $('#dcProg').value, type: $('#dcType').value, value: $('#dcVal').value, days: $('#dcDays').value } : null });
    closeModal();
    const n = r.updated || D.ids.length;
    toast(`${n} ${D.st.toLowerCase()}${r.emailed ? ' · ' + r.emailed + ' emailed' : ''}${r.awarded ? ' · ' + r.awarded + ' scholarship code' + (r.awarded === 1 ? '' : 's') : ''}. ${ap ? '🎉' : ''}`);
    S.frSel = new Set();
    await loadFormResponses(S.fr.form.FormID);
  });
}

window.addEventListener('popstate', () => {
  if (IN_GAS) return;
  const p = pathParams(window.location.pathname);
  if (document.querySelector('.modal.show')) closeModal();
  S.routing = true;
  try {
    if (p.page) { window.location.reload(); return; }
    if (p.sec && S.user && !LANDING_SECS[p.sec] || (p.sec && S.user && S.view !== 'public')) { goApp(p.sec, p.arg || undefined); return; }
    if (p.auth) { if (S.view !== 'public') renderPublic(true); openAuth(p.auth); return; }
    renderPublic(true);
    if (p.sec && LANDING_SECS[p.sec]) setTimeout(() => go(LANDING_SECS[p.sec]), 120);
  } finally { setTimeout(() => { S.routing = false; }, 0); }
});
function setDocTitle(t) {
  const st = (S.pub && S.pub.settings) || {}, base = st.SITE_TITLE || st.ACADEMY_NAME || BOOT.academy || document.title;
  try { document.title = t ? t + ' · ' + (st.ACADEMY_NAME || base) : base; } catch (e) {}
}
function brandRgb(h) { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
// Applies Settings → Site & branding: tab icon, title, search description, brand colours, analytics.
function applyBranding() {
  const st = (S.pub && S.pub.settings) || {};
  const head = document.head, link = (rel) => { let l = head.querySelector('link[rel="' + rel + '"]'); if (!l) { l = document.createElement('link'); l.rel = rel; head.appendChild(l); } return l; };
  const icon = safeUrl(st.SITE_ICON_URL) || safeUrl(st.LOGO_URL);
  if (icon && S._icon !== icon) { S._icon = icon; link('icon').href = icon; link('apple-touch-icon').href = icon; }
  if (st.SITE_DESCRIPTION) { let m = head.querySelector('meta[name="description"]'); if (!m) { m = document.createElement('meta'); m.name = 'description'; head.appendChild(m); } m.content = st.SITE_DESCRIPTION; }
  const c1 = brandRgb(st.BRAND_COLOR) ? st.BRAND_COLOR : '', c2 = brandRgb(st.BRAND_COLOR2) ? st.BRAND_COLOR2 : '';
  const key = c1 + c2;
  if (S._brand !== key) {
    S._brand = key;
    let el = document.getElementById('brandCss');
    if (!el) { el = document.createElement('style'); el.id = 'brandCss'; head.appendChild(el); }
    if (!key) el.textContent = '';
    else {
      const a = c1 || '#2563eb', b = c2 || c1 || '#7c3aed', rb = brandRgb(b);
      el.textContent = `:root{--blue:${a};--purple:${b};--grad:linear-gradient(135deg,${a} 0%,${b} 100%)}.btn-grad{box-shadow:0 10px 22px -10px rgba(${rb.join(',')},.7)}.nav-i.active,.text-primary{color:${a}!important}`;
    }
    const tc = head.querySelector('meta[name="theme-color"]'); if (tc && c1) tc.content = c1;
  }
  const ga = /^G-[A-Z0-9]{4,15}$/.test(st.GA_MEASUREMENT_ID || '') ? st.GA_MEASUREMENT_ID : '';
  if (ga && !S._ga && !IN_GAS) {
    S._ga = ga; window.dataLayer = window.dataLayer || []; window.gtag = function () { window.dataLayer.push(arguments); };
    gtag('js', new Date()); gtag('config', ga);
    const sc = document.createElement('script'); sc.async = true; sc.src = 'https:' + '/' + '/www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(ga); head.appendChild(sc);
  }
}
function siteAddressNudge() {
  if (IN_GAS || !S.user || S.user.role !== 'ADMIN' || !S.pub) return '';
  const here = window.location.origin, set = safeUrl(S.pub.settings.FRONTEND_URL).replace(/\/+$/, '');
  if (!/^https:/.test(here) || /localhost|127\.0\.0\.1/.test(here) || set === here || store.get('bpa_nudge_' + here)) return '';
  return `<div class="alert alert-warning d-flex flex-wrap align-items-center gap-2 mb-4" id="addrNudge"><i class="fa-solid fa-link"></i><div class="flex-fill small">You're using <b>${esc(here.replace(/^https:../, ''))}</b>, but links in emails, QR codes and certificates use <b>${esc((set || 'the Apps Script address').replace(/^https:../, ''))}</b>.</div><button class="btn btn-sm btn-grad" onclick="useThisAddress(this)">Use ${esc(here.replace(/^https:../, ''))} for all links</button><button class="btn btn-sm btn-light" onclick="store.set('bpa_nudge_${esc(here)}','1');$('#addrNudge').remove()">Not now</button></div>`;
}
async function useThisAddress(btn) {
  await busy(btn, async () => { S.adm = await call('saveSettings', { settings: { FRONTEND_URL: window.location.origin } }); await refreshPublic(); const n = $('#addrNudge'); if (n) n.remove(); toast('Done. New links now use ' + window.location.host + '. 🎉'); if (S.sec === 'settings') nav('settings', 'site'); });
}

async function init() {
  const p = BOOT.params || {};
  if (p.coupon && normCode(p.coupon)) { const cc = normCode(p.coupon); store.set('bpa_coupon', cc); setTimeout(() => toast('🎁 Coupon ' + cc + ' saved. It will be applied automatically when you enrol.', 'info'), 1400); }
  let cached = null;
  try { cached = JSON.parse(store.get('bpa_pub') || 'null'); } catch (e) { cached = null; }
  const plainLanding = !S.token && !p.page && !p.sec && !p.auth;
  let savedUser = null;
  try { savedUser = JSON.parse(store.get('bpa_user') || 'null'); } catch (e) { savedUser = null; }
  if (cached) { S.pub = cached; applyBranding(); }
  if (S.token && savedUser && cached && !p.page && !p.auth && !(p.sec && LANDING_SECS[p.sec] && savedUser.role === 'STUDENT' && !STUDENT_PAGES[p.sec])) {
    S.pub = cached; S.user = savedUser; rcLoad(); window.__booted = true; S.urlReplace = true; goApp(p.sec, p.arg || undefined);
    call('me').then(u => { if (u && S.user) { Object.assign(S.user, u); saveUser(); } }).catch(() => {});
    call('publicData').then(f => { S.pub = f; try { store.set('bpa_pub', JSON.stringify(f)); } catch (e) {} }).catch(() => {});
    return;
  }
  if (cached && plainLanding) { S.pub = cached; window.__booted = true; renderPublic(); }
  const meReq = S.token ? call('me').then(u => u, () => null) : Promise.resolve(null);
  let fresh;
  try { fresh = await call('publicData'); }
  catch (e) {
    if (cached && plainLanding) return;
    window.__booted = true;
    $('#app').innerHTML = `<div class="boot"><div class="text-center px-3" style="max-width:520px"><i class="fa-solid fa-triangle-exclamation fa-2x mb-3 text-warning"></i><h4 class="fw-bold">The academy is not ready yet</h4><p style="color:#c7d2fe">${esc(e.message)}</p><p style="color:#a5b4fc;font-size:.85rem">Administrator: run <b>setup</b> then <b>testApp</b> in the Apps Script editor and check the execution log.</p><button class="btn btn-light mt-2" onclick="location.reload()">Try again</button></div></div>`;
    return;
  }
  window.__booted = true;
  try { store.set('bpa_pub', JSON.stringify(fresh)); } catch (e) {}
  if (cached && plainLanding) {
    const changed = JSON.stringify(fresh) !== JSON.stringify(cached);
    S.pub = fresh;
    if (changed && S.view === 'public' && !document.querySelector('.modal.show')) { const y = window.scrollY; renderPublic(); window.scrollTo(0, y); }
    return;
  }
  S.pub = fresh; applyBranding();
  if (S.token) { S.user = await meReq; if (!S.user) { S.token = ''; store.del('bpa_lms_token'); } else { saveUser(); rcLoad(); } }
  if (p.page === 'payment' && (p.reference || p.trxref)) return showPaymentReturn(p.reference || p.trxref);
  if (p.page === 'verify-email' && p.token) return doVerifyEmail(p.token);
  if (p.page === 'reset' && p.token) { renderPublic(true); return setTimeout(() => openAuth('reset', p.token), 300); }
  if (p.page === 'cert') return renderCertVerify(p.code || '');
  if (p.page === 'class' && p.c && p.t) return openHubLink(p);
  if (p.page === 'join' && p.p && p.k) return renderJoinPage(p.p, p.k);
  if (p.page === 'r' && p.u) return handleTrackedLink(p);
  if (p.page === 'form' && p.f && p.k) return renderFormPage(p.f, p.k);
  if (p.page === 'unsub' && p.e && p.t) return renderUnsub(p);
  if (p.page === 'course' && p.id) { renderPublic(true); return setTimeout(() => { if (findProg(p.id)) openProgramme(p.id); else go('programmes'); }, 300); }
  if (p.auth) { renderPublic(true); return setTimeout(() => openAuth(S.user ? 'login' : p.auth), 300); }
  if (S.user) { S.urlReplace = true; return goApp(p.sec, p.arg || undefined); }
  if (p.sec && LANDING_SECS[p.sec]) { renderPublic(true); return setTimeout(() => go(LANDING_SECS[p.sec]), 350); }
  if (p.sec) { S.afterLogin = { sec: p.sec, arg: p.arg }; renderPublic(true); return setTimeout(() => openAuth('login'), 300); }
  renderPublic(true);
}
function labelTables() {
  $$('table.tbl').forEach(t => {
    const ths = $$('thead th', t).map(th => th.textContent.trim());
    if (!ths.length) return;
    t.classList.add('tbl-stack');
    $$('tbody tr', t).forEach(tr => Array.from(tr.children).forEach((td, i) => { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', ths[i] || ''); }));
  });
}
let _labT = null;
try { new MutationObserver(() => { clearTimeout(_labT); _labT = setTimeout(labelTables, 30); }).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
